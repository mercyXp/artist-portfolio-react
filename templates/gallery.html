{% extends "base.html" %}

{% block content %}
<section class="py-5 bg-light" id="gallery">
  <div class="container">
    <h2 class="text-center mb-5">Gallery</h2>
    <div class="row">
      {% for art in artworks %}
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="{{ art.image }}" class="card-img-top" alt="{{ art.title }}">
          <div class="card-body">
            <h5 class="card-title">{{ art.title }}</h5>
            <p class="card-text">{{ art.description }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
